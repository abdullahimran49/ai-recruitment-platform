[pytest]
testpaths = tests
python_files = test_*.py
# Not "Test*": the ORM models (Test, TestAssignment) would be collected as
# test classes and warn on every run.
python_classes = *Tests
addopts = -q --tb=short
filterwarnings =
    # Pre-existing across the codebase: datetime.utcnow() is deprecated on
    # 3.12+. Fixing it means moving every column to timezone-aware datetimes,
    # which is its own change — not something to smuggle into a test run.
    ignore:datetime.datetime.utcnow.*:DeprecationWarning
markers =
    llm: needs a live LLM (slow, costs tokens, non-deterministic). Run with --llm.
